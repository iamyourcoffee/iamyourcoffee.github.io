name: Coffee Auto Posting Bot

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    - name: ⏰ 인간화 지연 (실전 모드)
      run: |
        echo "구글 알고리즘을 속이기 위해 랜덤 잠복 후 기상합니다..."
        sleep $((RANDOM % 7200 + 60))

    - name: 🤖 커피 1호기 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot_coffee.py

    - name: 🚀 깃허브 서버에 자동 Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 [자동발행] 새벽에 커피 봇이 향긋한 포스팅을 완료했습니다!" || echo "No changes to commit"
        git push
