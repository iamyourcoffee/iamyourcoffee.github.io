name: Coffee Auto Posting Bot

on:
  schedule:
    - cron: '0 23 * * *'  # 한국 시간 매일 아침 8시 가동!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 🚨 공주님 어명: 10분 넘게 농땡이 피우면 강제 사형!
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai requests bs4

    - name: 🤖 커피 1호기 즉시 가동 (대기 시간 없음!)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot_coffee.py

    - name: 🚀 깃허브 서버에 자동 Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 [자동발행] 커피 봇 포스팅 완료" || echo "변경 사항 없음"
        git pull --rebase || true
        git push
